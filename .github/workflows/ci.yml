name: CI

on:
  push:
    branches: [dev, wallentx/rust]
  pull_request:
    branches: [dev, wallentx/rust]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install into isolated prefix
        run: cargo install --path rust --locked --root "$RUNNER_TEMP/graft-prefix"

      - name: Exercise every command and an indexed fixture
        env:
          GRAFT_BIN: ${{ runner.temp }}/graft-prefix/bin/graft
          GRAFT_STORE: ${{ runner.temp }}/graft-smoke.db
          GRAFT_HOME: ${{ runner.temp }}/graft-home
        run: |
          set -euxo pipefail
          "$GRAFT_BIN" --version
          for command in build ask grep callers skeleton map mcp init check export completions cache version upgrade viz status; do
            "$GRAFT_BIN" "$command" --help >/dev/null
          done
          smoke=$(mktemp -d)
          mkdir -p "$smoke/src" "$GRAFT_HOME"
          printf '%s\n' 'export function greet(name: string) { return "hello " + name; }' 'export function main() { return greet("world"); }' > "$smoke/src/a.ts"
          git -C "$smoke" init -q
          "$GRAFT_BIN" --store "$GRAFT_STORE" build "$smoke"
          "$GRAFT_BIN" --store "$GRAFT_STORE" ask greet "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" grep greet --path "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" callers greet --path "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" skeleton a.ts --path "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" map "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" check "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" status "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" export "$RUNNER_TEMP/export.json" --path "$smoke" --json
          "$GRAFT_BIN" --store "$GRAFT_STORE" viz "$smoke" --output "$RUNNER_TEMP/map.html"
          HOME="$GRAFT_HOME" "$GRAFT_BIN" init --provider codex --dry-run --json
          test ! -e "$GRAFT_HOME/.codex/config.toml"
          HOME="$GRAFT_HOME" "$GRAFT_BIN" init --provider codex
          grep -q '\[mcp_servers.graft\]' "$GRAFT_HOME/.codex/config.toml"
          HOME="$GRAFT_HOME" "$GRAFT_BIN" init --provider codex --deregister
          if grep -q '\[mcp_servers.graft\]' "$GRAFT_HOME/.codex/config.toml"; then
            exit 1
          fi
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | "$GRAFT_BIN" --store "$GRAFT_STORE" mcp "$smoke" | grep -q '"tools"'
          "$GRAFT_BIN" --store "$GRAFT_STORE" grep greet --path "$smoke" | head -n 1 >/dev/null
          "$GRAFT_BIN" --store "$GRAFT_STORE" cache clear --yes
          printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"status","arguments":{}}}' | "$GRAFT_BIN" --store "$GRAFT_STORE" mcp "$smoke" | grep -q '"indexed":true'
          printf '%s\n' 'export function added() { return greet("again"); }' >> "$smoke/src/a.ts"
          printf '%s\n' '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"find","arguments":{"query":"added"}}}' | "$GRAFT_BIN" --store "$GRAFT_STORE" mcp "$smoke" | grep -q 'added'
          "$GRAFT_BIN" --store "$GRAFT_STORE" cache doctor

  termux-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and run in Termux Bionic userland
        run: |
          set -euxo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace termux/termux-docker:latest bash -lc "
            set -eu
            pkg update -y
            pkg install -y rust clang make git pkg-config
            cargo test --workspace --all-targets --locked
            cargo build --workspace --release --locked
            file target/release/graft
            target/release/graft --version
            target/release/graft version --json
          "
