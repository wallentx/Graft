[package]
name = "graft"
version = "0.8.2"
edition = "2024"
description = "Native repository context graph CLI"
license = "MIT"
repository = "https://github.com/wallentx/Graft"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.0"
ignore = "0.4.31"
libc = "0.2.189"
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
